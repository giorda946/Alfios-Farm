<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alfio's Farm - Prenotazione Uova</title>
<style>
body{
font-family: Arial, sans-serif;
background:#f8f6f0;
margin:0;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
}

.logo{
width:220px;
display:block;
margin:auto;
}

h1{
text-align:center;
color:#5c3d00;
margin-top:10px;
}

p{
text-align:center;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

.prezzo{
margin-top:15px;
font-size:18px;
text-align:center;
}

.totale{
font-size:24px;
color:#2e7d32;
font-weight:bold;
}

button{
width:100%;
margin-top:25px;
padding:15px;
background:#25D366;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}
</style>
</head>
<body>
<div class="container">
<img src="Logo.png" class="logo" alt="Alfio's Farm">
<h1>Alfio's Farm</h1>
<p>Prenota le tue uova fresche</p>
<form id="ordineForm">

<label>Nome</label>
<input type="text" id="nome" required>

<label>Cognome</label>
<input type="text" id="cognome" required>

<label>Telefono</label>
<input type="tel" id="telefono" required>

<label>Prodotto</label>
<select id="prodotto" required>
    <option value="Uova di Gallina">Uova di Gallina</option>
    <option value="Uova di Nana">Uova di Nana</option>
</select>

<label>Numero di uova (minimo 4)</label>
<input type="number" id="quantita" min="4" value="4" required>

<div class="prezzo">
Prezzo: 0,50 € per uovo
</div>

<div class="prezzo">
Totale ordine:
<div class="totale" id="totale">€ 2,00</div>
</div>

<label>Data di ritiro (disponibile dal quinto giorno rispetto ad oggi)</label>
<input type="date" id="data" required>

<button type="submit">
Invia richiesta su WhatsApp
</button>

</form>
</div>
<script>

const prezzoUovo = 0.50;

const quantitaInput = document.getElementById("quantita");
const totaleDiv = document.getElementById("totale");

function aggiornaTotale(){
let q = parseInt(quantitaInput.value) || 4;
totaleDiv.innerHTML = "€ " + (q * prezzoUovo).toFixed(2).replace(".", ",");
}

quantitaInput.addEventListener("input", aggiornaTotale);

aggiornaTotale();

const dataInput = document.getElementById("data");

let oggi = new Date();
oggi.setDate(oggi.getDate() + 5);

dataInput.min = oggi.toISOString().split("T")[0];

document.getElementById("ordineForm").addEventListener("submit", function(e){

e.preventDefault();

const nome = document.getElementById("nome").value;
const cognome = document.getElementById("cognome").value;
const telefono = document.getElementById("telefono").value;
const prodotto = document.getElementById("prodotto").value;
const quantita = document.getElementById("quantita").value;
const data = document.getElementById("data").value;

const totale = (quantita * prezzoUovo).toFixed(2).replace(".", ",");

const messaggio =
`🥚 Nuova richiesta Alfio's Farm

Nome: ${nome}
Cognome: ${cognome}
Telefono: ${telefono}

Prodotto: ${prodotto}

Quantità: ${quantita} uova

Totale: € ${totale}

Data ritiro: ${data}`;

const url =
`https://wa.me/393382102771?text=${encodeURIComponent(messaggio)}`;

window.open(url, "_blank");

});

</script>
</body>
</html>
